<style>

  :root{

  /* 整体宽度：按可视高度反推，保证一屏放下不用滚 */
  .wrap{

    .wrap{width:min(100%, max(240px, calc((100dvh - 232px) * 0.599)));}

  /* header */
  .hd{text-align:center;}
  .hd-top{display:flex; align-items:center; justify-content:center; gap:7px;}
  .badge{
    font-size:10.5px; font-weight:800; letter-spacing:.5px;
    color:#fff; background:linear-gradient(135deg,#73b7e5,#3f83bd);

  h1{
    margin:0; font-size:21px; letter-spacing:2px; font-weight:800;

  .sub{margin:2px 0 0; font-size:10px; color:var(--ink-2); line-height:1.4; letter-spacing:.2px;}

  /* stats */
  .stats{display:flex; gap:7px;}
  .stat{
    flex:1; background:rgba(255,255,255,.74);
    border:1px solid rgba(79,139,190,.12);
    border-radius:12px; padding:4px 9px;
    box-shadow:0 6px 16px -12px rgba(55,105,150,.7);
    display:flex; flex-direction:column; gap:1px;
    min-width:0;
    height:48px;                       /* 固定高度：换名字不会把棋盘顶下去 */
    justify-content:center;
  }
  .stat span{font-size:9.5px; color:var(--ink-2); letter-spacing:1px; line-height:1.3; flex:none;}
  .stat strong{font-size:16px; font-variant-numeric:tabular-nums; color:var(--red); letter-spacing:.5px; line-height:1.15;}
  .next-stat{flex:1.65; flex-direction:row; align-items:center; justify-content:space-between; gap:5px;}
  .next-row{display:flex; align-items:center; gap:5px; min-width:0; flex:1; justify-content:flex-end;}
  #next{width:36px; height:36px; display:block; flex:none;}
  .next-row em{
    font-style:normal; font-size:10px; font-weight:700; color:var(--ink);
    line-height:1.18;
    flex:0 1 5em; width:5em; min-width:0; max-width:5em;
    height:2.36em;                     /* 恒定两行高度，名字长短都不跳动 */
    display:-webkit-box; -webkit-box-orient:vertical; -webkit-line-clamp:2;
    overflow:hidden; overflow-wrap:anywhere;
    text-align:right;
  }

  /* board */
  .board{
    position:relative; border-radius:18px; overflow:hidden;
    width:100%;
    background:linear-gradient(180deg,#f8fcff,#e7f3fc);
    box-shadow:
      0 22px 44px -22px rgba(50,100,150,.55),
      inset 0 0 0 1px rgba(79,139,190,.16);
  }
  #game{display:block; width:100%; height:auto; touch-action:none; cursor:pointer;}

  /* overlay */
  .overlay{
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    background:rgba(237,247,255,.76);
    backdrop-filter:blur(7px); -webkit-backdrop-filter:blur(7px);
    transition:opacity .25s ease, visibility .25s;
  }
  .overlay.hide{opacity:0; visibility:hidden; pointer-events:none;}
  .card{text-align:center; padding:0 22px; max-width:320px;}
  .card h2{margin:0 0 8px; font-size:20px; letter-spacing:2px; color:var(--red);}
  .card p{margin:0 0 14px; font-size:12px; line-height:1.8; color:#526b84;}
  .card .score-big{font-size:32px; font-weight:800; color:var(--red); font-variant-numeric:tabular-nums; margin:2px 0 10px;}
  .card .score-big small{font-size:11px; color:var(--ink-2); font-weight:600; letter-spacing:1px; display:block; margin-bottom:2px;}
  button{
    font-family:inherit; cursor:pointer; border:none; border-radius:10px;
    font-weight:800; letter-spacing:1px;
    transition:transform .12s ease, box-shadow .2s ease, background .2s;
  }
  button:active{transform:translateY(1px) scale(.99);}
  .btn-main{
    font-size:14px; padding:11px 30px; color:#fff;
    background:linear-gradient(135deg,#78bce8,#478dca);
    box-shadow:0 12px 22px -12px rgba(71,141,202,.75), inset 0 1px 0 rgba(255,255,255,.22);
  }

  /* toast */
  .toast{
    position:absolute; left:50%; top:15%; transform:translate(-50%,-8px);
    padding:7px 15px; border-radius:11px; font-size:12px; font-weight:800;
    color:#fff; letter-spacing:.8px; white-space:nowrap;
    background:linear-gradient(135deg,#efa1ba,#5b9ed3);
    box-shadow:0 12px 26px -12px rgba(60,110,160,.9);
    opacity:0; pointer-events:none; transition:opacity .25s, transform .25s;
  }
  .toast.on{opacity:1; transform:translate(-50%,0);}

  /* chain */
  .chain-box{
    background:rgba(255,255,255,.58); border:1px solid rgba(79,139,190,.1);
    border-radius:12px; padding:3px 8px 1px;
  }
  .chain-cap{font-size:9px; color:var(--ink-2); letter-spacing:.4px; margin-bottom:0; line-height:1.35;}
  #chaincvs{display:block; width:100%; height:auto;}

  /* footer */
  .ft{display:flex; gap:7px;}
  .ft button{
    flex:1; font-size:12px; padding:7px 0; letter-spacing:1px;
    color:#3576ae; background:rgba(255,255,255,.78);
    border:1px solid rgba(79,139,190,.2);
    box-shadow:0 6px 14px -12px rgba(55,105,150,.9);

  @media (max-width: 374px){
    .next-row em{font-size:9px; flex-basis:4.7em; max-width:4.7em;}
    #next{width:32px; height:32px;}
  }

  /* 矮屏收紧 */
  @media (max-height: 700px){
    h1{font-size:19px;}
    .sub{display:none;}
    .ft button{padding:6px 0;}
    .chain-box{display:none;}
    .stat{height:44px;}
  }

  /* ============================================================
     2. 画布与尺寸
     ============================================================ */
  const W = 420, H = 640;
  const SPAWN_Y = 66;
  const DEATH_Y = 106;
  const G = 1600;
  // 碰撞手感：原来 REST 只有 0.08、切向摩擦 0.36，两颗球会互相“粘”住；
  // 现在提高弹性、降低切向摩擦，变成轻轻一碰就弹开。
  const REST = 0.43;         // 球与球：碰撞弹得更明显
  const REST_FLOOR = 0.34;   // 球与地面：能弹起，但不会一直乱跳
  const REST_WALL = 0.46;    // 球与两侧墙
  const FRICTION = 0.075;    // 切向摩擦
  const DANGER_TIME = 15;   // 稳定越线 15 秒才失败
  const DANGER_SPEED = 72;   // 仍在快速运动或弹跳时，不累计失败时间
  const HIT_FX_V = 150;      // 撞击超过这个相对法向速度才出小火花
  const PI2 = Math.PI * 2;

  // 合成冲击波：轻推附近的球，质量越小被推得越远
  const PUSH_R = 122;        // 波及半径
  const PUSH_MAX = 165;      // 单个球的最大速度增量
  const PUSH_REF_R = 46;     // 参考半径：比它小的推得更远，比它大的推得少

  const cvs = document.getElementById('game');
  const ctx = cvs.getContext('2d');
  const DPR = Math.min(window.devicePixelRatio || 1, 2);
  cvs.width = W * DPR;
  cvs.height = H * DPR;
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

  /* ============================================================
     3. 状态
     ============================================================ */
  const BEST_KEY = 'xmu-merge-best-v2';
  let balls = [];
  let particles = [];
  let shocks = [];
  let floats = [];
  let flowers = [];
  let pending = [];
  let score = 0;
  let assistLeft = 5;
  let best = 0;
  try { best = parseInt(localStorage.getItem(BEST_KEY) || '0', 10) || 0; } catch(e){ best = 0; }
  let state = 'ready';           // ready | playing | over
  let cooldown = 0;
  let aimX = W / 2;
  let nextLevel = pickLevel();
  let lastT = 0;
  let acc = 0;
  let shake = 0;
  let touchAiming = false;

  /* ============================================================
     4. 音效
     ============================================================ */
  let ac = null, muted = false;
  function blip(freq, dur, type, gain){
    if (muted) return;
    try{
      if (!ac) ac = new (window.AudioContext || window.webkitAudioContext)();
      if (ac.state === 'suspended') ac.resume();
      const t = ac.currentTime;
      const o = ac.createOscillator(), g = ac.createGain();
      o.type = type || 'sine';
      o.frequency.setValueAtTime(freq, t);
      o.frequency.exponentialRampToValueAtTime(Math.max(60, freq * 0.72), t + (dur || 0.12));
      g.gain.setValueAtTime(0.0001, t);
      g.gain.linearRampToValueAtTime(gain || 0.05, t + 0.012);
      g.gain.exponentialRampToValueAtTime(0.0001, t + (dur || 0.12));
      o.connect(g); g.connect(ac.destination);
      o.start(t); o.stop(t + (dur || 0.12) + 0.03);
    }catch(e){}
  }

  /* ============================================================
     5. 工具
     ============================================================ */
  function pickLevel(){
    const weights = [25, 25, 20, 15, 15];
    let total = 0;
    for (let i = 0; i < weights.length; i++) total += weights[i];
    let r = Math.random() * total;
    for (let i = 0; i < weights.length; i++){
      r -= weights[i];
      if (r <= 0) return i;
    }
    return 0;
  }

  function makeBall(x, y, lv, vx, vy){
    const r = LEVELS[lv].r;
    return {
      x: x, y: y, vx: vx || 0, vy: vy || 0,
      r: r, m: r * r, level: lv,
      touched: false, danger: 0, appear: 0.16, dead: false, fx: 0
    };
  }

  function addScore(n, x, y){
    score += n;
    document.getElementById('score').textContent = score;
    if (score > best){
      best = score;
      document.getElementById('best').textContent = best;
      try { localStorage.setItem(BEST_KEY, String(best)); } catch(e){}
    }
    if (x !== undefined) floats.push({ x: x, y: y, text: '+' + n, life: 1 });
  }

  function burst(x, y, color, n){
    for (let i = 0; i < n; i++){
      const a = Math.random() * PI2;
      const sp = 60 + Math.random() * 200;
      particles.push({
        x: x, y: y,
        vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 40,
        r: 1.6 + Math.random() * 3.2, color: color, life: 1
      });
    }
  }

  // 撞击小火花：只是让“碰一下”有反馈，不参与物理
  function sparks(x, y, n, k){
    if (particles.length > 170) return;
    for (let i = 0; i < n; i++){
      const a = Math.random() * PI2;
      const sp = 40 + Math.random() * (70 + 120 * k);
      particles.push({
        x: x, y: y,
        vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
        r: 1.0 + Math.random() * 1.5,
        color: '#c98f2b',
        life: 0.5 + Math.random() * 0.3, spark: true
      });
    }
  }

  // 合成冲击波环
  function ring(x, y, rMax, color, alpha){
    shocks.push({ x: x, y: y, r: 6, rMax: rMax, life: 1, color: color, alpha: alpha });
  }

  // 合成爆炸：轻推附近的球，质量越小的被推得越远
  function pushWave(x, y, power, skip){
    for (let i = 0; i < balls.length; i++){
      const b = balls[i];
      if (b.dead || b === skip) continue;
      let dx = b.x - x, dy = b.y - y;
      const reach = PUSH_R + b.r;
      if (dx > reach || dx < -reach || dy > reach || dy < -reach) continue;
      let d = Math.sqrt(dx * dx + dy * dy);
      if (d > reach) continue;
      if (d < 0.5){ dx = 0; dy = -1; d = 1; }
      const gap = Math.max(0, d - b.r);          // 表面距离
      const f = 1 - Math.min(1, gap / PUSH_R);
      // 距离衰减改为 0.65 次幂：比原来的平方衰减更平缓，远处也能被推动。
      const fall = Math.pow(f, 0.65);
      // 冲量除以质量：m = r²，所以轻球加速多、重球加速少。
      // 限制质量倍率，避免最小球过猛、最大球几乎完全不动。
      const massFactor = Math.max(0.22, Math.min(2.6,
        (PUSH_REF_R * PUSH_REF_R) / b.m
      ));
      const dv = Math.min(PUSH_MAX, power * fall * massFactor);
      if (dv < 2) continue;
      b.vx += dx / d * dv;
      b.vy += dy / d * dv;
    }
  }

  let toastTimer = null;
  function toast(msg){
    const el = document.getElementById('toast');
    el.textContent = msg;
    el.classList.add('on');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ el.classList.remove('on'); }, 1900);
  }

  function easeOutBack(t){
    const c1 = 1.70158, c3 = c1 + 1;
    return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2);
  }

  /* ============================================================
     6. 物理
     ============================================================ */
  function step(h){
    for (let i = 0; i < balls.length; i++){
      const b = balls[i];
      b.vy += G * h;
      b.vx *= 0.9992;
      b.x += b.vx * h;
      b.y += b.vy * h;

      if (b.x - b.r < 0){ b.x = b.r; if (b.vx < 0) b.vx = -b.vx * REST_WALL; }
      if (b.x + b.r > W){ b.x = W - b.r; if (b.vx > 0) b.vx = -b.vx * REST_WALL; }
      if (b.y + b.r > H){
        b.y = H - b.r;
        if (b.vy > 0) b.vy = -b.vy * REST_FLOOR;
        b.vx *= 0.94;
        b.touched = true;
      }
    }

    for (let i = 0; i < balls.length; i++){
      const a = balls[i];
      for (let j = i + 1; j < balls.length; j++){
        const b = balls[j];
        let dx = b.x - a.x, dy = b.y - a.y;
        const rs = a.r + b.r;
        if (dx > rs || dx < -rs || dy > rs || dy < -rs) continue;
        let d2 = dx * dx + dy * dy;
        if (d2 >= rs * rs) continue;
        let d = Math.sqrt(d2);
        if (d === 0){ d = 0.01; dx = 0.01; dy = 0; }

        const nx = dx / d, ny = dy / d;
        const overlap = rs - d;
        const ima = 1 / a.m, imb = 1 / b.m, tot = ima + imb;

        a.x -= nx * overlap * (ima / tot);
        a.y -= ny * overlap * (ima / tot);
        b.x += nx * overlap * (imb / tot);
        b.y += ny * overlap * (imb / tot);

        const rvx = b.vx - a.vx, rvy = b.vy - a.vy;
        const vn = rvx * nx + rvy * ny;
        if (vn < 0){
          const jn = -(1 + REST) * vn / tot;
          a.vx -= jn * nx * ima; a.vy -= jn * ny * ima;
          b.vx += jn * nx * imb; b.vy += jn * ny * imb;
          if (a.level !== b.level && vn < -45){
            const kick = Math.min(0.10, -vn / 6000);
            a.vx -= jn * nx * ima * kick; a.vy -= jn * ny * ima * kick;
            b.vx += jn * nx * imb * kick; b.vy += jn * ny * imb * kick;
          }

          const tx = -ny, ty = nx;
          const vt = rvx * tx + rvy * ty;
          const jt = (-vt / tot) * FRICTION;
          a.vx -= jt * tx * ima; a.vy -= jt * ty * ima;
          b.vx += jt * tx * imb; b.vy += jt * ty * imb;

          // 撞得够狠才冒几颗小火花（很轻，只是让碰撞有反馈）
          if (vn < -HIT_FX_V && a.fx <= 0 && b.fx <= 0 && a.level !== b.level){
            const k = Math.min(1, (-vn - HIT_FX_V) / 620);
            sparks(a.x + nx * a.r, a.y + ny * a.r, 2 + (k > 0.45 ? 2 : 0), k);
            a.fx = 0.11; b.fx = 0.11;
          }
        }

        a.touched = true;
        b.touched = true;

        if (a.level === b.level && !a.dead && !b.dead){
          let dup = false;
          for (let k = 0; k < pending.length; k++){
            if (pending[k][0] === a || pending[k][0] === b ||
                pending[k][1] === a || pending[k][1] === b){ dup = true; break; }
          }
          if (!dup) pending.push([a, b]);
        }
      }
    }

    if (pending.length) processMerges();
  }

  function processMerges(){
    for (let i = 0; i < pending.length; i++){
      const a = pending[i][0], b = pending[i][1];
      if (a.dead || b.dead) continue;
      a.dead = true; b.dead = true;

      const lv = a.level;
      const mx = (a.x + b.x) / 2;
      const my = (a.y + b.y) / 2;

      if (lv === MAX_LV){
        addScore(5000, mx, my);
        flowers.push({ x: mx, y: my, age: 0, maxR: 76, rotation: Math.random() * PI2 });
        burst(mx, my, '#ef9fbb', 46);
        ring(mx, my, 150, '#ef9fbb', 0.72);
        pushWave(mx, my, 130);
        shake = 10;
        blip(660, 0.32, 'triangle', 0.09);
        setTimeout(function(){ blip(990, 0.4, 'triangle', 0.07); }, 110);
        toast('🌸 海棠花绽开，青春正好！');
        continue;
      }

      const nl = lv + 1;
      const nb = makeBall(mx, my, nl, (a.vx + b.vx) * 0.3, (a.vy + b.vy) * 0.3 - 34);
      nb.touched = a.touched || b.touched;
      nb.appear = 0.18;
      balls.push(nb);

      // 合成爆炸：轻推周围的球，球越小被推得越远（新球自己不吃自己的推力）
      pushWave(mx, my, 24 + nl * 7, nb);
      ring(mx, my, 26 + nl * 10, LEVELS[nl].color, 0.30 + nl * 0.02);

      addScore((nl + 1) * (nl + 2) * 5, mx, my);
      burst(mx, my, LEVELS[nl].color, 9 + nl * 2);
      blip(300 + nl * 44, 0.1, 'sine', 0.045);

      if (nl === MAX_LV){
        shake = 7;
        toast('🎓 恭喜合成大同一中！');
        burst(mx, my, '#c9a227', 34);
        setTimeout(function(){ blip(880, 0.3, 'triangle', 0.08); }, 120);
      }
    }
    pending.length = 0;
    balls = balls.filter(function(b){ return !b.dead; });
  }

  /* ============================================================
     7. 更新
     ============================================================ */
  function update(dt){
    if (cooldown > 0) cooldown -= dt;

    if (state === 'playing'){
      acc += dt;
      const SUB = 1 / 240;
      let guard = 0;
      while (acc >= SUB && guard < 24){
        step(SUB);
        acc -= SUB;
        guard++;
      }
      if (guard >= 24) acc = 0;

      for (let i = 0; i < balls.length; i++){
        const b = balls[i];
        const aboveLine = b.touched && b.y - b.r < DEATH_Y;
        const nearlySettled = Math.hypot(b.vx, b.vy) < DANGER_SPEED;
        if (aboveLine && nearlySettled){
          b.danger += dt;
          if (b.danger > DANGER_TIME){ gameOver(); break; }
        } else if (b.danger > 0){
          // 弹回线下或仍在运动都会快速解除警报，不会“擦线就输”。
          b.danger = Math.max(0, b.danger - dt * 3.5);
        }
      }
    }

    for (let i = particles.length - 1; i >= 0; i--){
      const p = particles[i];
      if (p.spark){
        p.vy += 460 * dt;
        p.vx *= 0.93;
      } else {
        p.vy += 900 * dt;
        p.vx *= 0.985;
      }
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.life -= dt * (p.spark ? 3.2 : 1.7);
      if (p.life <= 0) particles.splice(i, 1);
    }
    for (let i = shocks.length - 1; i >= 0; i--){
      const s = shocks[i];
      s.r += (s.rMax - s.r) * Math.min(1, dt * 13);
      s.life -= dt * 2.6;
      if (s.life <= 0) shocks.splice(i, 1);
    }
    for (let i = floats.length - 1; i >= 0; i--){
      const f = floats[i];
      f.y -= 42 * dt;
      f.life -= dt * 1.25;
      if (f.life <= 0) floats.splice(i, 1);
    }
    for (let i = flowers.length - 1; i >= 0; i--){
      const f = flowers[i];
      f.age += dt;
      f.y -= 3 * dt;
      if (f.age > 3.2) flowers.splice(i, 1);
    }
    if (shake > 0) shake = Math.max(0, shake - dt * 26);

    for (let i = 0; i < balls.length; i++){
      const b = balls[i];
      if (b.appear > 0) b.appear = Math.max(0, b.appear - dt);
      if (b.fx > 0) b.fx -= dt;
    }
  }

  /* ============================================================
     8. 绘制
     ============================================================ */
  // 一枚“校徽圆章”：白底 + 圆形裁切校徽 + 彩色外环
  function drawBadge(c, cx, cy, R, lv){
    c.save();
    c.translate(cx, cy);

    c.beginPath();
    c.arc(0, 0, R, 0, PI2);
    c.fillStyle = '#ffffff';
    c.fill();

    const img = emblemImgs[lv];
    const rc2 = R * 0.88;
    if (img && img.complete && img.naturalWidth > 0){
      const side = rc2 * 2 * 0.99;
      c.save();
      c.beginPath();
      c.arc(0, 0, rc2, 0, PI2);
      c.clip();
      c.drawImage(img, -side / 2, -side / 2, side, side);
      c.restore();
    } else {
      c.beginPath();
      c.arc(0, 0, rc2, 0, PI2);
      c.fillStyle = LEVELS[lv].color;
      c.fill();
    }

    const w = Math.max(1.6, R * 0.075);
    c.beginPath();
    c.arc(0, 0, R - w / 2, 0, PI2);
    c.lineWidth = w;
    c.strokeStyle = (lv === MAX_LV) ? '#d4a017' : LEVELS[lv].color;
    c.stroke();

    c.restore();
  }


  function drawBegonia(c, x, y, R, open, alpha, rotation){
    c.save();
    c.translate(x, y);
    c.rotate(rotation || 0);
    c.scale(Math.max(0.04, open), Math.max(0.04, open));
    c.globalAlpha = alpha;
    c.shadowColor = 'rgba(238,128,165,0.42)';
    c.shadowBlur = R * 0.22;
    for (let k = 0; k < 5; k++){
      c.save();
      c.rotate(k * PI2 / 5);
      const pg = c.createRadialGradient(0, -R * 0.24, R * 0.04, 0, -R * 0.62, R * 0.92);
      pg.addColorStop(0, '#fff9fc');
      pg.addColorStop(0.42, '#fac2d4');
      pg.addColorStop(1, '#e77fa4');
      c.beginPath();
      c.moveTo(0, 0);
      c.bezierCurveTo(-R * 0.16, -R * 0.22, -R * 0.62, -R * 0.52, -R * 0.49, -R * 0.91);
      c.bezierCurveTo(-R * 0.39, -R * 1.19, R * 0.39, -R * 1.19, R * 0.49, -R * 0.91);
      c.bezierCurveTo(R * 0.62, -R * 0.52, R * 0.16, -R * 0.22, 0, 0);
      c.fillStyle = pg; c.fill();
      c.shadowBlur = 0;
      c.strokeStyle = 'rgba(204,91,130,0.34)'; c.lineWidth = Math.max(0.7, R * 0.014); c.stroke();
      c.beginPath(); c.moveTo(0, -R * 0.12); c.quadraticCurveTo(-R * 0.04, -R * 0.48, 0, -R * 0.92);
      c.strokeStyle = 'rgba(255,255,255,0.48)'; c.lineWidth = Math.max(0.6, R * 0.012); c.stroke();
      c.restore();
    }
    c.shadowBlur = 0;
    c.fillStyle = '#f8d884';
    c.beginPath(); c.arc(0, 0, R * 0.18, 0, PI2); c.fill();
    for (let k = 0; k < 12; k++){
      const a = k * PI2 / 12;
      const x1 = Math.cos(a) * R * 0.06, y1 = Math.sin(a) * R * 0.06;
      const x2 = Math.cos(a) * R * 0.29, y2 = Math.sin(a) * R * 0.29;
      c.beginPath(); c.moveTo(x1, y1); c.lineTo(x2, y2);
      c.strokeStyle = '#c98d36'; c.lineWidth = Math.max(0.7, R * 0.014); c.stroke();
      c.beginPath(); c.arc(x2, y2, Math.max(1.1, R * 0.032), 0, PI2);
      c.fillStyle = '#fff0a8'; c.fill();
    }
    c.beginPath(); c.arc(0, 0, R * 0.075, 0, PI2); c.fillStyle = '#e6a64e'; c.fill();
    c.restore();
  }

  function drawBloomEffect(f){
    const open = Math.min(1.12, easeOutBack(Math.min(1, f.age / 0.82)));
    const alpha = f.age > 2.4 ? Math.max(0, 1 - (f.age - 2.4) / 0.8) : 1;
    for (let k = 0; k < 5; k++){
      const subAge = f.age - 0.34 - k * 0.055;
      if (subAge <= 0) continue;
      const a = f.rotation + k * PI2 / 5 + 0.35;
      const dist = f.maxR * (0.86 + 0.08 * (k % 2));
      const subOpen = Math.min(1.08, easeOutBack(Math.min(1, subAge / 0.58)));
      drawBegonia(ctx, f.x + Math.cos(a) * dist, f.y + Math.sin(a) * dist,
        f.maxR * (0.19 + 0.025 * (k % 3)), subOpen, alpha * 0.88, -a + 0.4);
    }
    drawBegonia(ctx, f.x, f.y, f.maxR, open, alpha, f.rotation);
  }

  function drawBall(b){
    let s = 1;
    if (b.appear > 0){
      const dur = b.level === 0 ? 0.16 : 0.18;
      const k = 1 - b.appear / dur;
      s = 0.6 + 0.4 * easeOutBack(Math.max(0, Math.min(1, k)));
    }
    const r = b.r * s;

    ctx.save();
    ctx.beginPath();
    ctx.ellipse(b.x, b.y + b.r * 0.92, b.r * 0.78, b.r * 0.24, 0, 0, PI2);
    ctx.fillStyle = 'rgba(90,55,25,0.10)';
    ctx.fill();
    ctx.restore();

    drawBadge(ctx, b.x, b.y, r, b.level);

    // 高光
    ctx.save();
    ctx.beginPath();
    ctx.arc(b.x, b.y, r, 0, PI2);
    ctx.clip();
    const hg = ctx.createRadialGradient(
      b.x - r * 0.35, b.y - r * 0.45, r * 0.05,
      b.x - r * 0.3, b.y - r * 0.4, r * 1.5
    );
    hg.addColorStop(0, 'rgba(255,255,255,0.20)');
    hg.addColorStop(0.5, 'rgba(255,255,255,0)');
    hg.addColorStop(1, 'rgba(0,0,0,0.07)');
    ctx.fillStyle = hg;
    ctx.fillRect(b.x - r, b.y - r, r * 2, r * 2);
    ctx.restore();
  }

  function draw(){
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    ctx.clearRect(0, 0, W, H);

    const bg = ctx.createLinearGradient(0, 0, 0, H);
    bg.addColorStop(0, '#f8fcff');
    bg.addColorStop(0.55, '#eaf5fd');
    bg.addColorStop(1, '#d7eaf8');
    ctx.fillStyle = bg;
    ctx.fillRect(0, 0, W, H);

    const vg = ctx.createRadialGradient(W / 2, H * 0.42, 80, W / 2, H * 0.5, H * 0.72);
    vg.addColorStop(0, 'rgba(79,139,190,0.035)');
    vg.addColorStop(1, 'rgba(75,125,170,0.10)');
    ctx.fillStyle = vg;
    ctx.fillRect(0, 0, W, H);

    ctx.save();
    if (shake > 0) ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);

    // 警戒线
    let dmax = 0;
    for (let i = 0; i < balls.length; i++) if (balls[i].danger > dmax) dmax = balls[i].danger;
    const warn = Math.min(1, dmax / DANGER_TIME);
    const pulse = warn > 0.05 ? 0.6 + 0.4 * Math.sin(Date.now() / 110) : 0;

    ctx.save();
    ctx.setLineDash([7, 7]);
    ctx.lineWidth = 1.6 + warn * 1.6;
    ctx.strokeStyle = 'rgba(164,38,44,' + (0.28 + warn * 0.62 * (0.55 + 0.45 * pulse)).toFixed(3) + ')';
    if (warn > 0.2){ ctx.shadowColor = 'rgba(184,40,47,0.55)'; ctx.shadowBlur = 10 * warn; }
    ctx.beginPath();
    ctx.moveTo(12, DEATH_Y);
    ctx.lineTo(W - 12, DEATH_Y);
    ctx.stroke();
    ctx.restore();

    ctx.save();
    ctx.font = '600 9.5px "PingFang SC","Microsoft YaHei",sans-serif';
    ctx.fillStyle = 'rgba(164,38,44,' + (0.42 + warn * 0.5).toFixed(2) + ')';
    ctx.textAlign = 'right';
    ctx.fillText('警戒线', W - 14, DEATH_Y - 6);
    ctx.restore();

    // 投放辅助
    if (state === 'playing' && cooldown <= 0){
      const r = LEVELS[nextLevel].r;
      const x = Math.min(Math.max(aimX, r + 2), W - r - 2);
      ctx.save();
      ctx.setLineDash([5, 8]);
      ctx.lineWidth = 1.4;
      ctx.strokeStyle = 'rgba(80,125,165,0.26)';
      ctx.beginPath();
      ctx.moveTo(x, SPAWN_Y + r + 6);
      ctx.lineTo(x, H - 8);
      ctx.stroke();
      ctx.restore();

      ctx.save();
      ctx.globalAlpha = 0.36;
      drawBadge(ctx, x, SPAWN_Y, r, nextLevel);
      ctx.restore();
    }

    for (let i = 0; i < balls.length; i++) drawBall(balls[i]);

    // 合成冲击波环
    for (let i = 0; i < shocks.length; i++){
      const s = shocks[i];
      ctx.save();
      ctx.globalAlpha = Math.max(0, s.life) * s.alpha;
      ctx.strokeStyle = s.color;
      ctx.lineWidth = 1.2 + 2.4 * s.life;
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r, 0, PI2);
      ctx.stroke();
      ctx.restore();
    }

    for (let i = 0; i < particles.length; i++){
      const p = particles[i];
      ctx.save();
      ctx.globalAlpha = Math.max(0, p.life);
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r * p.life, 0, PI2);
      ctx.fill();
      ctx.restore();
    }

    for (let i = 0; i < flowers.length; i++) drawBloomEffect(flowers[i]);

    for (let i = 0; i < floats.length; i++){
      const f = floats[i];
      ctx.save();
      ctx.globalAlpha = Math.max(0, Math.min(1, f.life * 1.6));
      ctx.font = '800 15px "PingFang SC","Microsoft YaHei",sans-serif';
      ctx.textAlign = 'center';
      ctx.fillStyle = '#3f83bd';
      ctx.shadowColor = 'rgba(255,255,255,0.9)';
      ctx.shadowBlur = 5;
      ctx.fillText(f.text, f.x, f.y - (1 - f.life) * 24);
      ctx.restore();
    }

    ctx.restore();

    const lg = ctx.createLinearGradient(0, 0, 7, 0);
    lg.addColorStop(0, 'rgba(70,125,170,0.15)');
    lg.addColorStop(1, 'rgba(70,125,170,0)');
    ctx.fillStyle = lg;
    ctx.fillRect(0, 0, 7, H);
    const rg = ctx.createLinearGradient(W, 0, W - 7, 0);
    rg.addColorStop(0, 'rgba(70,125,170,0.15)');
    rg.addColorStop(1, 'rgba(70,125,170,0)');
    ctx.fillStyle = rg;
    ctx.fillRect(W - 7, 0, 7, H);
  }

  /* ============================================================
     9. 主循环
     ============================================================ */
  function loop(t){
    if (!lastT) lastT = t;
    let dt = (t - lastT) / 1000;
    lastT = t;
    if (dt > 0.05) dt = 0.05;
    update(dt);
    draw();
    requestAnimationFrame(loop);
  }

  /* ============================================================
     10. 交互（鼠标点一下 / 触屏按住拖动松手投放）
     ============================================================ */
  function pointerX(clientX){
    const rect = cvs.getBoundingClientRect();
    return (clientX - rect.left) * (W / rect.width);
  }

  cvs.addEventListener('pointermove', function(e){
    if (e.pointerType === 'mouse') aimX = pointerX(e.clientX);
    else if (touchAiming) aimX = pointerX(e.clientX);
  }, { passive: true });

  cvs.addEventListener('pointerdown', function(e){
    e.preventDefault();
    if (state !== 'playing') return;
    aimX = pointerX(e.clientX);
    if (e.pointerType === 'mouse'){
      drop();                       // 鼠标：点一下就投
    } else {
      touchAiming = true;           // 触屏：按下先瞄准，松手才投
    }
  });

  cvs.addEventListener('pointerup', function(e){
    if (!touchAiming) return;
    touchAiming = false;
    if (state !== 'playing') return;
    aimX = pointerX(e.clientX);
    drop();
  });

  cvs.addEventListener('pointercancel', function(){ touchAiming = false; });
  cvs.addEventListener('contextmenu', function(e){ e.preventDefault(); });

  function drop(){
    if (state !== 'playing' || cooldown > 0) return;
    const lv = nextLevel;
    const r = LEVELS[lv].r;
    const x = Math.min(Math.max(aimX, r + 2), W - r - 2);
    balls.push(makeBall(x, SPAWN_Y, lv, 0, 30));
    nextLevel = pickLevel();
    cooldown = 0.4;
    updateNextUI();
    blip(220, 0.07, 'sine', 0.03);
  }

  /* ============================================================
     11. 界面
     ============================================================ */
  const nextCvs = document.getElementById('next');
  const nextCtx = nextCvs.getContext('2d');
  const nextDpr = Math.min(window.devicePixelRatio || 1, 2);
  nextCvs.width = 80 * nextDpr;
  nextCvs.height = 80 * nextDpr;
  nextCtx.setTransform(nextDpr, 0, 0, nextDpr, 0, 0);

  function updateNextUI(){
    nextCtx.setTransform(nextDpr, 0, 0, nextDpr, 0, 0);
    nextCtx.clearRect(0, 0, 80, 80);
    drawBadge(nextCtx, 40, 40, 35, nextLevel);
    document.getElementById('nextName').textContent = LEVELS[nextLevel].short;
  }

  // 校徽图谱：由小到大一条（按累计宽度排版，互不重叠）
  function buildChain(){
    const cc = document.getElementById('chaincvs');
    if (!cc) return;
    const cctx = cc.getContext('2d');
    const CW = 400, CH = 100;
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    cc.width = CW * dpr;
    cc.height = CH * dpr;
    cctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    cctx.clearRect(0, 0, CW, CH);

    const cellW = (CW - 16) / 6;
    for (let i = 0; i < LEVELS.length; i++){
      const row = Math.floor(i / 6), col = i % 6;
      const r = 10 + i * 0.48;
      const x = 8 + cellW * (col + 0.5);
      const y = row === 0 ? 30 : 78;
      cctx.save();
      cctx.font = '700 7.5px "PingFang SC","Microsoft YaHei",sans-serif';
      cctx.textAlign = 'center';
      cctx.fillStyle = '#657f9b';
      cctx.fillText('第' + (LEVELS.length - i), x, y - r - 4);
      cctx.restore();
      drawBadge(cctx, x, y, r, i);
    }
  }

  function showOverlay(title, text, btnText, scoreHTML){
    const ov = document.getElementById('overlay');
    document.getElementById('ovTitle').textContent = title;
    document.getElementById('ovText').innerHTML = text;
    document.getElementById('ovBtn').textContent = btnText;
    const sc = document.getElementById('ovScore');
    if (scoreHTML){ sc.innerHTML = scoreHTML; sc.style.display = 'block'; }
    else sc.style.display = 'none';
    ov.classList.remove('hide');
  }

  function hideOverlay(){
    document.getElementById('overlay').classList.add('hide');
  }

  function gameOver(){
    if (state !== 'playing') return;
    state = 'over';
    blip(180, 0.35, 'sawtooth', 0.05);
    setTimeout(function(){ blip(120, 0.5, 'sawtooth', 0.05); }, 160);
    showOverlay(
      '装不下了',
      '校徽稳定堆过警戒线太久<br>弹跳过线不会失败，再来一局吧',
      '再来一局',
      '<small>本局得分</small>' + score
    );
  }

  function updateAssistUI(){
    const btn = document.getElementById('assist');
    btn.textContent = '✨ 助攻 ' + assistLeft;
    btn.disabled = assistLeft <= 0;
    btn.style.opacity = assistLeft > 0 ? '1' : '0.45';
  }

  function useAssist(){
    if (state !== 'playing'){
      toast('开始合成后可以使用青春助攻');
      return;
    }
    if (assistLeft <= 0) return;

    // 找到场上最高级的一对相同校徽，只把它们送到一起，仍由物理碰撞完成合成。
    for (let lv = MAX_LV; lv >= 0; lv--){
      const pair = balls.filter(function(b){ return !b.dead && b.level === lv; });
      if (pair.length < 2) continue;
      const a = pair[0], b = pair[1];
      const mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2;
      const r = a.r;
      const x = Math.min(Math.max(mx, r + 4), W - r - 4);
      const y = Math.min(Math.max(my, DEATH_Y + r + 12), H - r - 8);
      a.x = x - r * 0.45; b.x = x + r * 0.45;
      a.y = b.y = y;
      a.vx = b.vx = 0; a.vy = b.vy = 0;
      a.danger = b.danger = 0;
      a.touched = b.touched = true;
      assistLeft--;
      updateAssistUI();
      ring(x, y, 72, '#e88eac', 0.55);
      blip(760, 0.16, 'triangle', 0.06);
      toast('✨ 青春助攻：' + LEVELS[lv].short + '贴贴！');
      return;
    }
    toast('先投出两枚相同校徽，再来助攻吧');
  }

  function reset(){
    balls = [];
    particles = [];
    shocks = [];
    floats = [];
    flowers = [];
    pending = [];
    score = 0;
    assistLeft = 5;
    cooldown = 0;
    acc = 0;
    shake = 0;
    touchAiming = false;
    document.getElementById('score').textContent = '0';
    document.getElementById('best').textContent = best;
    nextLevel = pickLevel();
    updateNextUI();
    updateAssistUI();
    state = 'playing';
    hideOverlay();
  }

  document.getElementById('ovBtn').addEventListener('click', function(){
    if (state === 'over') reset();
    else { state = 'playing'; hideOverlay(); }
    blip(520, 0.09, 'sine', 0.04);
  });

  document.getElementById('restart').addEventListener('click', reset);
  document.getElementById('assist').addEventListener('click', useAssist);

  const muteBtn = document.getElementById('mute');
  muteBtn.addEventListener('click', function(){
    muted = !muted;
    muteBtn.textContent = muted ? '🔇 音效关' : '🔊 音效开';
    if (!muted) blip(700, 0.08, 'sine', 0.04);
  });

  window.addEventListener('keydown', function(e){
    if (e.code === 'Space'){ e.preventDefault(); if (state === 'playing') drop(); }
    if (e.key === 'r' || e.key === 'R') reset();
  });

  // 手机：阻止下拉刷新 / 双指缩放
  document.addEventListener('gesturestart', function(e){ e.preventDefault(); });
  document.addEventListener('touchmove', function(e){
    if (e.target === cvs) e.preventDefault();
  }, { passive: false });

  /* ============================================================
     12. 启动
     ============================================================ */
  document.getElementById('best').textContent = best;
  buildChain();
  updateNextUI();
  showOverlay(
    '合成大同一中',
    '移动选择落点，点击投放<br>每局 5 次青春助攻，让相同校徽靠近合成',
    '开始合成'
  );
  requestAnimationFrame(loop);

  // 调试钩子：__xmuDebug().balls
  window.__xmuDebug = function(){
    return {
      balls: balls, particles: particles, flowers: flowers, shocks: shocks, pending: pending,
      score: score, state: state, nextLevel: nextLevel, levels: LEVELS, assistLeft: assistLeft,
      pushWave: pushWave, push: { R: PUSH_R, MAX: PUSH_MAX, REF_R: PUSH_REF_R }
    };
  };

  window.addEventListener('load', function(){ updateNextUI(); buildChain(); });
})();

</script>


</body></html>
